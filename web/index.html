<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>netscout</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="mask-icon" href="/icon.svg" color="#1a202c" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <p class="credit">Developer: Stephen Brodigan, Build: __BUILD__</p>
    <h1>🛰️ netscout</h1>
    <a href="http://myapps.local">All apps</a>
    <div class="controls">
      <input id="cidr" type="text" placeholder="192.168.1.0/24 (blank = auto)" />
      <button id="run-btn">Run scan</button>
      <button id="diff-btn" class="secondary">Compare with previous</button>
    </div>
    <p id="status" class="status"></p>
  </header>

  <main>
    <section id="places-section">
      <h2>Where the Pis live</h2>
      <ul id="places" class="history places"></ul>
    </section>

    <section id="history-section">
      <div class="section-head">
        <h2>Scan history</h2>
        <button id="archive-btn" class="secondary" type="button">Archived scans</button>
      </div>
      <ul id="history" class="history"></ul>
    </section>

    <section id="archive-section" hidden>
      <div class="section-head">
        <h2>Archived scans</h2>
        <button id="archive-back" class="secondary" type="button">Recent scans</button>
      </div>
      <p class="hint">These are kept so you can open them. They stay off the main screen.</p>
      <ul id="archive" class="history"></ul>
    </section>

    <section id="detail-section" hidden>
      <h2 id="detail-title"></h2>
      <table class="hosts">
        <thead>
          <tr><th>IP</th><th>Hostname</th><th>Where it lives</th><th>Status</th><th>Open ports</th></tr>
        </thead>
        <tbody id="hosts-body"></tbody>
      </table>
    </section>

    <section id="diff-section" hidden>
      <h2>Changes since previous scan</h2>
      <div id="diff-body"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
